name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-and-test:
    name: Backend — Lint, Type Check & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop on syntax errors or undefined names; warn on style
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,migrations,.git,__pycache__
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics \
            --exclude=venv,migrations,.git,__pycache__
        continue-on-error: false

      - name: Run unit tests with coverage
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///:memory:
        run: |
          pip install pytest-cov
          python -m pytest tests/unit/ -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Server/coverage.xml

      - name: Check coverage threshold
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///:memory:
        run: |
          pip install pytest-cov
          python -m pytest tests/unit/ \
            --cov=. \
            --cov-fail-under=70 \
            -q
        continue-on-error: false

  frontend-build:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/UI/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build frontend
        env:
          VITE_API_URL: https://ridebookingsystem.onrender.com
          VITE_WS_URL: wss://ridebookingsystem.onrender.com
          VITE_GOOGLE_MAPS_API_KEY: placeholder-for-ci
          VITE_GOOGLE_MAPS_MAP_ID: placeholder-for-ci
        run: npm run build
        continue-on-error: true

  security-scan:
    name: Security — Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies for known CVEs
        run: |
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 \
            || echo "::warning::Vulnerabilities found — review pip-audit output"
        continue-on-error: true
